name: Builder

on:
  pull_request:
    branches:
      - main
    paths:
      - "bedside-audio/**"
      - ".github/workflows/build-app.yaml"
      - ".github/workflows/builder.yaml"
  push:
    branches:
      - main
    paths:
      - "bedside-audio/**"
      - ".github/workflows/build-app.yaml"
      - ".github/workflows/builder.yaml"

permissions:
  contents: read

jobs:
  build:
    name: Build Bedside Audio
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      app: bedside-audio
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit
