name: Bedside hardware (Music Assistant)
description: Voice PE hardware controls for a Music Assistant player
version: "0.11.1"
slug: bedside_audio
url: https://github.com/jpinz/bedside-audio
image: ghcr.io/jpinz/bedside-audio
arch:
  - aarch64
  - amd64
stage: experimental
homeassistant_api: true
options:
  music_assistant_player_entity: null
  voice_media_player_entity: null
  max_volume: 50
  led_playing_color: "#00FF30"
  led_playing_brightness: 12
  led_paused_color: "#FF7000"
  led_paused_brightness: 18
  led_sleeping_color: "#6000A0"
  led_sleeping_brightness: 8
  led_button_press_color: "#18BBF2"
  led_button_press_brightness: 10
  voice_button_event_entity: ""
  voice_assist_satellite_entity: ""
  voice_led_light_entity: ""
  voice_led_select_entity: ""
  voice_led_theme_text_entity: ""
  voice_volume_cap_number_entity: ""
schema:
  music_assistant_player_entity: str
  voice_media_player_entity: str
  max_volume: "int(1,50)"
  led_playing_color: str
  led_playing_brightness: "int(1,100)"
  led_paused_color: str
  led_paused_brightness: "int(1,100)"
  led_sleeping_color: str
  led_sleeping_brightness: "int(1,100)"
  led_button_press_color: str
  led_button_press_brightness: "int(1,100)"
  voice_button_event_entity: str
  voice_assist_satellite_entity: str
  voice_led_light_entity: str
  voice_led_select_entity: str
  voice_led_theme_text_entity: str
  voice_volume_cap_number_entity: str
