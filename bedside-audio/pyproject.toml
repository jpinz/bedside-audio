[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bedside-audio"
version = "0.11.1"
description = "Music Assistant hardware controls for Home Assistant Voice Preview Edition"
readme = "DOCS.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "websockets>=15,<17",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["bedside_audio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
